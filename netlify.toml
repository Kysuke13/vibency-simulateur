# Les fonctions lisent les variables au moment de l'appel.
# Sur Netlify : SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# VIBENCY_USERNAME, VIBENCY_PASSWORD, SESSION_SECRET.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
